name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Validate GLSL shader syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator -S frag src/main/resources/assets/autoluma/shaders/post/brightness_lift.fsh
      - name: Compile and run JUnit tests
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoLuma-26.3-build
          path: |
            build/libs/autoluma-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
